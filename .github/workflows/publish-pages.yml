name: Publicar Web no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar HTML e JavaScript
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re, subprocess, tempfile

          html = Path("index.html").read_text(encoding="utf-8")
          parser = HTMLParser()
          parser.feed(html)
          parser.close()

          required = [
              'registar-local-bairro',
              'campo-neighborhood-select',
              'search-input',
              'registar-local-bairro-novo',
              'signup-country-field',
              'input-country',
          ]
          missing = [x for x in required if f'id="{x}"' not in html]
          if missing:
              raise SystemExit(f"Missing required element(s): {missing}")

          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.I|re.S)
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                  f.write(script)
                  path = f.name
              subprocess.run(["node", "--check", path], check=True)

          print(f"Validated {len(scripts)} inline script block(s).")
          PY

      - name: Preparar Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
