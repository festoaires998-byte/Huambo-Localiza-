<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angola Localiza</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0a0f18; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color:#e8e6df; display:flex; justify-content:center; padding:24px 12px; }
  #app-shell { width:100%; max-width:400px; background:#101826; border-radius:20px; padding-bottom:8px; overflow:hidden; }
  input, textarea { font-family: inherit; }
  .al-tab { cursor:pointer; }
  button { cursor:pointer; }
</style>
</head>
<body>

<div id="app-shell">
  <div style="padding:18px 18px 10px;">
    <div style="display:flex;align-items:center;gap:10px;">
      <div style="width:38px;height:38px;border-radius:10px;background:#f2790f;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <span style="font-size:20px;">📍</span>
      </div>
      <div style="flex:1;">
        <div style="font-size:16px;font-weight:600;color:#f5f3ec;">Angola Localiza</div>
        <div id="session-label" style="font-size:11px;color:#f2790f;">ANGOLA · sem sessão</div>
      </div>
    </div>
  </div>

  <div id="view-login" style="padding:0 18px;">
    <div style="display:flex;background:#1a2436;border-radius:10px;padding:3px;margin-bottom:14px;">
      <button id="tab-signin" style="flex:1;background:#f2790f;color:#101826;border:none;height:32px;border-radius:8px;font-size:13px;font-weight:500;">Entrar</button>
      <button id="tab-signup" style="flex:1;background:none;color:#a3a094;border:none;height:32px;border-radius:8px;font-size:13px;font-weight:500;">Criar conta</button>
    </div>
    <input id="input-email" type="email" placeholder="email" style="width:100%;background:#1a2436;border:1px solid rgba(232,230,223,0.12);border-radius:8px;height:38px;padding:0 12px;color:#e8e6df;margin:0 0 8px;" />
